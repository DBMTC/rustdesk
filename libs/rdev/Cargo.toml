[package]
name = "rdev"
version = "0.5.0-2"
edition = "2018"
license = "MIT"
publish = false
description = "rdev, with an X11-free build when the x11 feature is off"

[features]
default = []
x11 = ["dep:rdev-upstream"]
serialize = []

[dependencies]
rdev-upstream = { git = "https://github.com/rustdesk-org/rdev", package = "rdev", optional = true }
enum-map = "2.4.0"
lazy_static = "1.4"
serde = { version = "1.0", features = ["derive"], optional = true }
strum = "0.24.1"
strum_macros = "0.24"
widestring = "1.0.2"
log = "0.4"

[target.'cfg(target_os = "linux")'.dependencies]
epoll = { version = "4.1.0" }
inotify = { version = "0.10.0", default-features = false }
libc = "0.2"
mio = { version = "0.8.4", features = ["os-poll", "os-ext"] }

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.24.0"
core-foundation = { version = "0.9.3" }
core-foundation-sys = { version = "0.8.3" }
core-graphics = { version = "0.22.3", features = ["highsierra"] }
dispatch = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
winapi = { version = "0.3", features = ["winuser", "errhandlingapi", "processthreadsapi"] }
